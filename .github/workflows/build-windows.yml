name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pyinstaller --clean --noconfirm SmartStruxure_Beschriftungsgenerator.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SmartStruxure_Beschriftungsgenerator-Windows
          path: dist/SmartStruxure_Beschriftungsgenerator.exe
